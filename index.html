<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Calculator.png">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
    <h1>Tip Calculator</h1>
    <!-- A parent container to wrap all child elements -->
    <div class="container">
        <form action="">
            <label for="currency">Select a currency</label>
            <select id="currency">
                <!-- Options for dollar and RS will add more currencies later -->
                <option value="Rs">Rs</option>
                <option value="$">$</option>
            </select>
            <label for="bill_amount">Enter bill amount</label>
            <input type="number" id="bill_amount">
            <span class="error" id="error_bill_amount">Error! Enter a valid Bill Amount must be greater than 0</span>
            <label for="tip_percent">Select tip percent</label>
            <span>
                <button type="button" id="tip_button_1">10%</button>
                <button type="button" id="tip_button_2">15%</button>
                <button type="button" id="tip_button_3">20%</button>
            </span>
            <input type="number" id="tip_percent">
            <span class="error" id="error_tip_percent">Error! Tip % should be equal or greater than 0</span>
            <label for="number_of_people">Enter number of people</label>
            <input type="number" id="number_of_people">
            <span class="error" id="error_number_of_people">Error! Enter atleast 1 people</span>
            <div>
                <p class="total">Total Tip:
                    <span class="total" id="result_total_tip">0.00</span>
                </p>
                <p class="total">Total Amount:
                    <span class="total" id="result_total_amount">0.00</span>
                </p>
                <p class="total">Pay Per Person:
                    <span class="total" id="result_pay_per_person">0.00</span>
                </p>
            </div>
            <div>
                <button type="button" id="reset_button">Reset</button>
            </div>
        </form>
    </div>
    </main>
</body>
<script src="script.js"></script>

</html>
